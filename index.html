<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Natural Regions: Amazon Basin &amp; Temperate Grasslands</title>
<style>
:root{--bg:#070707;--red:#e10600;--dim:#9a9a9a;--tx:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Georgia,'Times New Roman',serif}
header{padding:22px 5vw 8px}
h1{margin:0;font:900 clamp(26px,5vw,52px)/1 Impact,'Arial Black',sans-serif;letter-spacing:2px;text-transform:uppercase}h1 b{color:var(--red)}
.sub{color:var(--dim);font:14px Arial,sans-serif;margin-top:8px;letter-spacing:1px}
main{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(260px,1fr);gap:20px;padding:10px 5vw 40px}
@media(max-width:820px){main{grid-template-columns:1fr}}
.map{border:1px solid #2a0000;background:radial-gradient(circle at 50% 40%,#1a0000,#070707 70%);border-radius:6px;padding:6px}
svg{width:100%;height:auto;display:block}
#in{max-height:76vh;margin:0 auto}.st{fill:#c00;stroke:#000;stroke-width:.9;cursor:pointer;transition:fill .2s}.st:hover,.st.sel{fill:#ff3322}
#sn{text-align:center;font:700 15px Arial,sans-serif;letter-spacing:2px;text-transform:uppercase;padding:8px;min-height:36px}
.note{color:var(--dim);font:13px/1.5 Arial,sans-serif;margin-top:12px}
.side h2{font:700 13px Arial,sans-serif;letter-spacing:3px;color:var(--red);text-transform:uppercase;margin:16px 0 6px}.side h2:first-child{margin-top:0}
.side button{display:block;width:100%;text-align:left;background:none;border:0;border-left:3px solid #3a0000;color:#fff;padding:8px 12px;margin:3px 0;font:16px Georgia,serif;cursor:pointer;transition:.2s}
.side button:hover{border-color:var(--red);background:#1a0000;padding-left:18px}
#view{position:fixed;inset:0;z-index:9;display:none;overflow:hidden;background:#000}#view.on{display:block}
#bg{position:absolute;inset:0;background-size:cover;background-position:center}#bg svg{position:absolute;inset:0;width:100%;height:100%}
#shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.85),rgba(0,0,0,.4) 70%,rgba(80,0,0,.35))}
#txt{position:absolute;inset:0;overflow:auto;padding:max(70px,calc(env(safe-area-inset-top,0px) + 60px)) 5vw 90px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:30px;align-content:start}
@media(max-width:820px){#txt{grid-template-columns:1fr}}
.tag{display:inline-block;background:var(--red);color:#fff;font:700 12px Arial,sans-serif;letter-spacing:2px;padding:5px 10px;text-transform:uppercase}
#txt h2{font:900 clamp(28px,5vw,52px)/1.05 Impact,'Arial Black',sans-serif;text-transform:uppercase;margin:14px 0 6px;text-shadow:0 2px 12px #000}
#txt .ln{width:90px;height:4px;background:var(--red);margin:10px 0 18px}
#txt p,#txt li{font-size:clamp(16px,2vw,20px);line-height:1.6;color:#fff;text-shadow:0 1px 8px #000;margin:0 0 12px}
#txt ul{padding-left:20px;margin:0}#txt li::marker{color:var(--red)}
.mp{background:rgba(0,0,0,.72);border:1px solid var(--red);padding:12px;align-self:start;position:sticky;top:0}
.mt{font:700 12px Arial,sans-serif;letter-spacing:3px;color:var(--red);text-transform:uppercase;margin-bottom:8px}
.mc{font:13px/1.4 Arial,sans-serif;color:#ddd;margin-top:8px}
.bar{position:absolute;left:0;right:0;bottom:0;display:flex;gap:8px;align-items:center;padding:12px 5vw calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,#000)}
.bar button,.top button,.bar label{background:#000;color:#fff;border:1px solid var(--red);padding:9px 14px;font:700 13px Arial,sans-serif;letter-spacing:1px;cursor:pointer;text-transform:uppercase}
.bar button:hover,.top button:hover,.bar label:hover{background:var(--red)}
.bar span{flex:1;text-align:center;color:var(--dim);font:12px Arial,sans-serif}
.top{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:5vw}
</style></head><body>

const S=[
{id:'a1',sp:'Aariz',t:'Introduction to Natural Regions',sc:'globe',b:['The Earth has different natural regions, each with its own climate, soil, vegetation, wildlife and human activities.','These conditions shape what people eat, wear, the houses they build and the work they do.','The Amazon Basin is hot, wet and covered in dense rainforest. Temperate Grasslands are vast open plains covered mainly with grass.']},
{id:'a2',sp:'Aariz',t:'Tropical Regions: The Amazon Basin',sc:'river',b:['Named after the Amazon River, the largest river basin in the world.','A river basin is the area drained by a river and its tributaries.']},
{id:'a3',sp:'Aariz',t:'Location of the Amazon Basin',sc:'river',b:['In South America, close to the Equator, mainly between 10°N and 10°S.','The Amazon River flows from the Andes in the west to the Atlantic Ocean in the east.','Covers large parts of Brazil and extends into Peru, Bolivia, Ecuador and Colombia.']},
{id:'m1',sp:'Myra',t:'Climate of the Amazon Basin',sc:'rain',b:['Equatorial climate: hot, wet and humid all year.','High temperature from direct sunlight and high humidity day and night.','Heavy rainfall almost every day; very little seasonal variation.']},
{id:'m2',sp:'Myra',t:'Soil of the Amazon Basin',sc:'soil',b:['Highly weathered and leached: rainwater washes soluble nutrients from the upper soil.','Acidic and relatively poor in nutrients; nutrients are stored in living plants and organic matter.','When forests are cleared, the exposed soil quickly loses fertility.']},
{id:'m3',sp:'Myra',t:'Vegetation of the Amazon Basin',sc:'forest',b:['Dense tropical evergreen rainforest; trees grow tall and close together.','The canopy forms a thick roof, so the forest floor is dark, warm and damp.','Rubber trees, mahogany, ebony, orchids and bromeliads.','Orchids and bromeliads grow on other plants; bromeliads collect water in their leaves.']},
{id:'m4',sp:'Myra',t:'Wildlife of the Amazon Basin',sc:'forest',b:['Mammals: monkeys, sloths, tapirs, jaguars.','Birds: toucans, macaws, hummingbirds.','Reptiles: anacondas, boa constrictors, crocodiles.','Fish: piranhas and many freshwater fish. This variety of life is called biodiversity.']},
{id:'m5',sp:'Myra',t:'People of the Amazon Basin',sc:'village',b:['Food: hunting, fishing, gathering; manioc, pineapple, sweet potato, maize, bananas.','Houses: wood, bamboo, palm leaves and thatch; large communal houses called Malocas.','Shifting (slash-and-burn) cultivation: clear a small plot, then move on so the land can recover.','Threat: deforestation for farming and cattle ranching. Protecting the Amazon keeps ecological balance.']},
{id:'u1',sp:'Muneeb',t:'Introduction to Temperate Grasslands',sc:'grass',b:['Large open lands where grass is the dominant vegetation and trees are scarce.','Not enough rainfall for dense forests; found in continental interiors, away from the moderating effect of oceans.']},
{id:'u2',sp:'Muneeb',t:'Location of Temperate Grasslands',sc:'grass',b:['Between about 30° and 55° latitude in both hemispheres, in continental interiors.','Prairies: North America (USA, Canada).','Pampas: South America (Argentina, Uruguay).','Steppes: Eurasia (Russia, Kazakhstan).','Velds: South Africa.  Downs: Australia.']},
{id:'u3',sp:'Muneeb',t:'Climate of Temperate Grasslands',sc:'snow',b:['Continental climate: warm to hot summers, very cold winters with snowfall.','Moderate rainfall: enough for grass but often not for forests.']},
{id:'n1',sp:'Noorain',t:'Soil of Temperate Grasslands',sc:'soil2',b:['Deep, fertile and rich in humus from decaying grass roots.','Chernozem: dark, humus-rich soil ideal for wheat and maize.','Deep grass roots hold the soil together and reduce erosion.']},
{id:'n2',sp:'Noorain',t:'Vegetation of Temperate Grasslands',sc:'grass',b:['Tall grasses where rainfall is higher; short grasses in drier regions.','Trees are scarce, found mostly near rivers and lakes.','Buffalo grass, wheatgrass, grama grass, bluestem.']},
{id:'n3',sp:'Noorain',t:'Wildlife of Temperate Grasslands',sc:'grass',b:['Bison: large grazers of North America.','Prairie dogs, coyotes, antelopes and rabbits.','Many birds and insects.']},
{id:'n4',sp:'Noorain',t:'Life of People in Temperate Grasslands',sc:'farm',b:['Agriculture: wheat, maize, barley, oats, soybeans on large farms.','Machines such as the combine harvester, which cuts, threshes and cleans grain in one go.','Animal rearing: cattle and sheep; big cattle farms in North America are called ranches.']},
{id:'n5',sp:'Noorain',t:'Importance and Conclusion',sc:'globe',b:['Temperate grasslands grow food crops, support livestock, shelter wildlife and store carbon.','Climate, soil and vegetation shape how people live. Let us protect these regions and use their resources wisely. Thank you!']}
];
